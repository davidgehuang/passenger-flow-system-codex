# passenger-flow managed Nginx main configuration.
# Only the application server below is loaded. The previous /etc/nginx tree is
# backed up by deploy/setup-nginx.sh before this file replaces nginx.conf.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    include /etc/nginx/conf.d/passenger-flow.conf;
}
