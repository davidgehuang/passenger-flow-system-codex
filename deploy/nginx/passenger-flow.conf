# passenger-flow managed default-site snippet
# 安装位置：/etc/nginx/default.d/passenger-flow.conf（Rocky 8/9 默认 server 块内）。
# Nginx 使用默认 80 端口；公网必须在前置 ALB/网关终止 HTTPS，并限制本端口来源。
# Node 保持 BIND_HOST=127.0.0.1、PORT=3030，不要直接对公网监听。
client_max_body_size 1m;
access_log /var/log/nginx/passenger-flow.access.log;
error_log /var/log/nginx/passenger-flow.error.log warn;

location / {
    proxy_pass http://127.0.0.1:3030;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}
