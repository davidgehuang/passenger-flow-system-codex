# passenger-flow managed application server.
# Installed at /etc/nginx/conf.d/passenger-flow.conf by deploy/setup-nginx.sh.
# Port 80 is for a trusted private network or an HTTPS load balancer target only.
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 1m;
    access_log /var/log/nginx/passenger-flow.access.log;
    error_log /var/log/nginx/passenger-flow.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
